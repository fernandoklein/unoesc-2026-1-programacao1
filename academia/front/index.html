<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Academia</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">🏋️ Academia</span>
  </div>
</nav>

<div class="container mt-4">

<h3 class="mb-4">Sistema de Academia</h3>

<ul class="nav nav-pills mb-3">
  <li class="nav-item"><button class="nav-link active" onclick="mostrar('alunos', this)">Alunos</button></li>
  <li class="nav-item"><button class="nav-link" onclick="mostrar('planos', this)">Planos</button></li>
  <li class="nav-item"><button class="nav-link" onclick="mostrar('matriculas', this)">Matrículas</button></li>
</ul>

<!-- ALUNOS -->
<div id="alunos">
<div class="card p-3 mb-3">
<h5>Cadastro de Aluno</h5>

<div class="row g-2">
<div class="col-md-4">
<label>Nome</label>
<input class="form-control" id="nome" placeholder="Ex: João da Silva">
</div>

<div class="col-md-4">
<label>Email</label>
<input class="form-control" id="email" placeholder="Ex: joao@email.com">
</div>

<div class="col-md-4">
<label>Telefone</label>
<input class="form-control" id="telefone" placeholder="Ex: 49999999999">
</div>
</div>

<button class="btn btn-primary mt-3 w-100" onclick="criarAluno()">Salvar Aluno</button>
</div>

<table class="table table-striped">
<thead><tr><th>ID</th><th>Nome</th><th>Email</th></tr></thead>
<tbody id="tabelaAlunos"></tbody>
</table>
</div>

<!-- PLANOS -->
<div id="planos" style="display:none">
<div class="card p-3 mb-3">
<h5>Cadastro de Plano</h5>

<div class="row g-2">
<div class="col-md-4">
<label>Nome</label>
<input class="form-control" id="nomePlano" placeholder="Plano Mensal">
</div>

<div class="col-md-4">
<label>Duração (meses)</label>
<input class="form-control" id="duracao" placeholder="1, 3 ou 12">
</div>

<div class="col-md-4">
<label>Valor</label>
<input class="form-control" id="valor" placeholder="99.90">
</div>
</div>

<button class="btn btn-success mt-3 w-100" onclick="criarPlano()">Salvar Plano</button>
</div>

<table class="table table-striped">
<thead><tr><th>ID</th><th>Nome</th><th>Duração</th><th>Valor</th></tr></thead>
<tbody id="tabelaPlanos"></tbody>
</table>
</div>

<!-- MATRÍCULAS -->
<div id="matriculas" style="display:none">
<div class="card p-3 mb-3">
<h5>Nova Matrícula</h5>

<div class="row g-2">
<div class="col-md-4">
<label>Aluno</label>
<select id="idaluno" class="form-select"></select>
</div>

<div class="col-md-4">
<label>Plano</label>
<select id="idplano" class="form-select"></select>
</div>

<div class="col-md-4">
<label>Data de início</label>
<input type="date" class="form-control" id="data_inicio">
</div>
</div>

<button class="btn btn-warning mt-3 w-100" onclick="criarMatricula()">Salvar Matrícula</button>
</div>

<table class="table table-striped">
<thead>
<tr><th>Aluno</th><th>Plano</th><th>Início</th><th>Vencimento</th><th>Status</th></tr>
</thead>
<tbody id="tabelaMatriculas"></tbody>
</table>
</div>

</div>

<script src="./js/api.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/main.js"></script>

</body>
</html>
